{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact Us</title>

<link rel="stylesheet" href="contact.css">
<link rel="stylesheet" href="{% static 'css/contact.css' %}">

</head>

<body>

<header>

<h1>📞 Contact Us</h1>

<p>We'd love to hear from you.</p>

</header>

<section class="container">

<div class="info">

<h2>Contact Information</h2>

<p><strong>📧 Email:</strong> riyajavheri12@email.com</p>

<p><strong>📞 Phone:</strong> +91 8530573288</p>

<p><strong>📍 Address:</strong> A.Nagar, India</p>

</div>

<div class="form">

<h2>Send Message</h2>
{% if message %}
<p class="success-message">{{ message }}</p>
{% endif %}

<form method="POST">
    {% csrf_token %}

<input type="text" name="name" placeholder="Your Name" required>

<input type="email" name="email" placeholder="Your Email" required>

<textarea name="message" placeholder="Write your message..." rows="6" required></textarea>

<button type="submit">Send Message</button>

</form>

</div>

</section>

<footer>

<p>© 2026 Smart Plant Care System</p>

</footer>

</body>
</html>
